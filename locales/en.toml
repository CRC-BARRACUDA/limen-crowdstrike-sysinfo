stop = "Stop"
search = "Search"
search_hint = "serial, model, BIOS…"
filter = "Filter"
reachable = "Reachable hosts ({n}) — tick the ones to scan"
no_reachable = "No reachable hosts. RTR needs the host online."
scanned = "Scanned ({n}) — double-click a host to open its details"
open_host = "Open details"
not_scanned = "Not scanned ({n})"
col_host = "Host"
col_why = "Why"
shown_of = "{shown} of {total} shown"
no_match = "Nothing matches that search."

[state]
