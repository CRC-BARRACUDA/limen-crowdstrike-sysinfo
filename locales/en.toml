# English strings for the module's own screens.
#
# The default language: anything missing from another catalog falls back here,
# and anything missing here renders as its own key — visible enough to notice.
#
# `[module]` is different: the *host* reads it for the card and the tab, and
# English falls back to limen.toml — which is why it is in uk.toml and not here.

